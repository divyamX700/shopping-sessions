name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Image to time against: <repo url>@<sha>"
        required: false
        default: ""
      big:
        description: "Also generate and check a 60M-event set (1 = yes)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: nproc; lscpu | grep "Model name"; free -g; grep -o -m1 avx512bw /proc/cpuinfo || echo "no avx512"

      - name: Build
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q
          pip install --quiet polars pyarrow duckdb

      - name: Unit tests (scanner fuzz runs the AVX-512 path where the runner has it)
        run: RUSTFLAGS="-C target-cpu=x86-64-v3" cargo test --release -q 2>&1 | tail -3

      - name: Fixtures (fast path on, and the general pipeline alone)
        run: |
          python3 scripts/run_fixtures.py fixtures -- "$PWD/target/release/shopping" | tail -2
          SHOP_NOFAST=1 python3 scripts/run_fixtures.py fixtures -- "$PWD/target/release/shopping" | tail -1

      - name: Data
        run: |
          G=tools/generator/target/release/generate
          $G --seed 1 --events 1000000 --clicks 250000 --output "$RUNNER_TEMP/dev" | tail -1
          $G --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" | tail -1
          $G --seed 9 --events 5000000 --clicks 1250000 --output "$RUNNER_TEMP/s5" | tail -1

      - name: Exact diff, fast path vs general pipeline
        run: |
          for d in dev s5 p20; do
            a=$(mktemp -d); b=$(mktemp -d)
            SHOP_PROFILE=1 DATA_DIR="$RUNNER_TEMP/$d" OUTPUT_DIR="$a" NCPU=$(nproc) ./target/release/shopping 2>&1 | grep -E "fast|general" | tail -12
            SHOP_NOFAST=1 DATA_DIR="$RUNNER_TEMP/$d" OUTPUT_DIR="$b" NCPU=$(nproc) ./target/release/shopping
            echo "$d: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
          done

      - name: Output readable by polars, pyarrow and DuckDB alike
        run: |
          o=$(mktemp -d)
          DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$o" NCPU=$(nproc) ./target/release/shopping
          python3 scripts/readers.py "$o"

      - name: Official dev answer
        run: |
          o=$(mktemp -d)
          DATA_DIR="$RUNNER_TEMP/dev" OUTPUT_DIR="$o" ./target/release/shopping
          ls tools/dev-answer >/dev/null 2>&1 && (cd scripts && python3 compare.py "$o" ../tools/dev-answer | tail -1) || echo "no dev answer in repo"

      - name: Container timing, scorer flags (alternating)
        run: |
          docker build -q -t cur . >/dev/null
          BASE="${{ github.event.inputs.base }}"
          BASE=${BASE:-https://github.com/deltaparticle/Databricks-Buildathon@d3fb904bfe86c9958120418578f67d98ea958f12}
          if [ -n "$BASE" ]; then
            git clone -q "${BASE%@*}" /tmp/base && (cd /tmp/base && git checkout -q "${BASE##*@}")
            docker build -q -t base /tmp/base >/dev/null
            IMGS="cur base"
          else
            IMGS="cur"
          fi
          run() {
            out=$(mktemp -d); chmod 777 "$out"
            s=$(date +%s.%N)
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
              --cpus "$(nproc)" --memory 14g --memory-swap 14g --user 1000:1000 \
              -v "$2":/data:ro -v "$out":/output -e NCPU="$(nproc)" "$1" > /dev/null 2>&1 && code=0 || code=$?
            e=$(date +%s.%N)
            echo "$1 exit=$code wall=$(python3 -c "print(round($e-$s,3))")" | tee -a ab.txt
          }
          for i in 1 2 3 4 5 6 7; do for img in $IMGS; do run $img "$RUNNER_TEMP/p20"; done; done
          python3 - <<'PY'
          import statistics as st
          rows = [l.split() for l in open("ab.txt")]
          for img in ("cur", "base"):
              w = [float(r[2][5:]) for r in rows if r[0] == img and r[1] == "exit=0"]
              if w: print(f"{img}: median wall {st.median(w):.3f}s min {min(w):.3f}s n={len(w)}")
          PY

      - name: Where container time goes
        run: |
          N=$(nproc)
          for flags in "--cpus $N --memory 14g --memory-swap 14g"; do
          for k in 1 2; do
          out=$(mktemp -d); chmod 777 "$out"
          s=$(date +%s.%N)
          r=$(docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 $flags --user 1000:1000             -v "$RUNNER_TEMP/p20":/data:ro -v "$out":/output -e NCPU="$N" -e SHOP_PROFILE=1 cur 2>&1 | grep -E "epoch main (end|start)" | tail -1 | awk '{print $4}' || true)
          e=$(date +%s.%N)
          echo "flags [$flags] wall $(python3 -c "print(round($e-$s,3))") exit-latency $(python3 -c "print(round($e-${r:-0},3))")"
          done; done
          if docker image inspect base >/dev/null 2>&1; then for k in 1 2; do
            out=$(mktemp -d); chmod 777 "$out"; s=$(date +%s.%N)
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cpus $N --memory 14g --memory-swap 14g --user 1000:1000 -v "$RUNNER_TEMP/p20":/data:ro -v "$out":/output -e NCPU="$N" base >/dev/null 2>&1 || true
            e=$(date +%s.%N); echo "base wall $(python3 -c "print(round($e-$s,3))") output $(du -sb $out/user_daily | cut -f1) bytes, $(ls $out/user_daily | wc -l) files; campaign $(du -sb $out/campaign_daily | cut -f1)"
          done; fi
          out=$(mktemp -d); chmod 777 "$out"; docker run --rm --user 1000:1000 -v "$RUNNER_TEMP/p20":/data:ro -v "$out":/output -e NCPU="$N" cur >/dev/null 2>&1 || true
          echo "cur output $(du -sb $out/user_daily | cut -f1) bytes, $(ls $out/user_daily | wc -l) files"

      - name: 60M check
        if: ${{ github.event.inputs.big == '1' }}
        run: |
          rm -rf "$RUNNER_TEMP/s5" "$RUNNER_TEMP/dev"
          tools/generator/target/release/generate --seed 77 --events 60000000 --clicks 15000000 --output "$RUNNER_TEMP/p60" | tail -1
          a=$(mktemp -d)
          SHOP_PROFILE=1 DATA_DIR="$RUNNER_TEMP/p60" OUTPUT_DIR="$a" NCPU=$(nproc) ./target/release/shopping 2>&1 | grep -E "fast|general|Rss|AnonHuge" | tail -16
          b=$(mktemp -d)
          SHOP_NOFAST=1 DATA_DIR="$RUNNER_TEMP/p60" OUTPUT_DIR="$b" NCPU=$(nproc) ./target/release/shopping
          echo "p60: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
