name: knobs

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "space-separated env assignments to A/B (each against base X=1)"
        default: "SHOP_NONT=1 FAST_NO512=1 SHOP_THREADS=12 MIMALLOC_ALLOW_LARGE_OS_PAGES=0"
      rounds:
        default: "7"

permissions:
  contents: read

jobs:
  knobs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          nproc; lscpu | grep -E "Model name|Flags" | cut -c1-200
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q
          git clone -q https://github.com/loveconnor/larp-shopping-sessions-v5 /tmp/larp
          (cd /tmp/larp/native && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q)
          tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" | tail -1
      - name: A/B
        env:
          VARIANTS: ${{ inputs.variants }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          O=./target/release/shopping; L=/tmp/larp/native/target/release/shopping-sessions
          N=$(nproc)
          : > /tmp/t.txt
          for r in $(seq 1 $ROUNDS); do
            for v in LARP X=1 $VARIANTS; do
              out=$(mktemp -d)
              s=$(date +%s.%N)
              if [ $v = LARP ]; then env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR=$out NCPU=$N $L >/dev/null 2>&1
              else env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR=$out NCPU=$N MIMALLOC_ALLOW_LARGE_OS_PAGES=1 SHOP_PREAD=1 $v $O >/dev/null 2>&1; fi
              e=$(date +%s.%N)
              echo "$v $(python3 -c "print(round($e-$s,4))")" | tee -a /tmp/t.txt
              rm -rf $out
            done
          done
          echo "==== medians"
          python3 - <<'EOF'
          import collections, statistics
          d = collections.defaultdict(list)
          for line in open("/tmp/t.txt"):
              k, v = line.split()
              d[k].append(float(v))
          for k, v in d.items():
              print(f"{k:40s} median {statistics.median(v):.3f}  min {min(v):.3f}  n {len(v)}")
          EOF
